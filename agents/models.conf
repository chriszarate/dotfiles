# llama-server router-mode preset. Model paths are relative to LLM_MODELS_DIR,
# which defaults to ~/Code/models in setup-llm.sh and in
# launchd/org.zzz.llama-server.plist, which launches the server.
# Clients pick a model by name via the OpenAI `model` field (e.g. "cmd").

# Global defaults applied to every model; override per-section as needed.
[*]
ngl = 99
flash-attn = on

# Sized for consumer-grade laptops.
# [cmd]
# model = Qwen3.5-4B-UD-Q4_K_XL.gguf
# ctx-size = 8192
# load-on-startup = false

# Sized for a 128GB M5 Max: Qwen3.8 Flash Next at UD-IQ4_XS is ~94GB of weights
[local-agent]
model = Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00004.gguf
ctx-size = 131072
load-on-startup = true
sleep-idle-seconds = 600
