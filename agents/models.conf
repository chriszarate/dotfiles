# llama-server router-mode preset.
# Launch with: llama-server --models-preset ~/.dotfiles/agents/models.conf
# Clients pick a model by name via the OpenAI `model` field (e.g. "gemma", "qwen").

# Global defaults applied to every model; override per-section as needed.
[*]
ngl = 99
flash-attn = on
ctx-size = 32768
batch-size = 2048
ubatch-size = 2048

# Small, fast model: eagerly loaded so there's always something ready.
[gemma]
model = /Users/zzz/Code/models/gemma-4-12b-it-UD-Q4_K_XL.gguf
load-on-startup = true

# Larger model: lazily loaded on first request, unloaded after 5 min idle
# to free VRAM (both won't comfortably fit at once).
[qwen]
model = /Users/zzz/Code/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
load-on-startup = false
stop-timeout = 300
