# llama-server router-mode preset.
# Launch with: llama-server --models-preset ~/.dotfiles/agents/models.conf
# Clients pick a model by name via the OpenAI `model` field (e.g. "cmd").

# Global defaults applied to every model; override per-section as needed.
[*]
ngl = 99
flash-attn = on

# The model behind the ctrl-e keybinding (llm_cmd). Sized for a 16GB M1: at
# ~2.9GB it stays resident without pushing anything else out of memory, and
# answers a one-line "turn this into a shell command" request in 1-2 seconds.
# Prompts are a couple of sentences, so a small context is plenty and keeps
# the KV cache cheap.
[cmd]
model = /Users/zzz/Code/models/Qwen3.5-4B-UD-Q4_K_XL.gguf
ctx-size = 8192
load-on-startup = true

# Room for a bigger model here later, loaded lazily and unloaded when idle.
# Keep it under ~6GB or it will not fit alongside [cmd] on 16GB of memory —
# unsloth/Qwen3.5-9B-GGUF at Q4_K_M (~5.5GB) is about the ceiling.
# [big]
# model = /Users/zzz/Code/models/Qwen3.5-9B-Q4_K_M.gguf
# ctx-size = 32768
# load-on-startup = false
# stop-timeout = 300
