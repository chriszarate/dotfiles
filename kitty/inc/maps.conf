kitty_mod cmd+shift

# actions
map cmd+e       open_url_with_hints
map cmd+shift+e kitten hints --type=linenum --linenum-action=window fish -c "nvim +{line} {path}"

# layouts
map cmd+enter       launch --cwd=current
map cmd+l           next_layout
map cmd+z           toggle_layout stack
map kitty_mod+enter launch

# navigation
map cmd+[       previous_window
map cmd+]       next_window
map cmd+left    previous_tab
map cmd+right   next_tab
map cmd+p       kitten kittens/select_tab.py
map cmd+s       kitten kittens/toggle_tab_bar.py
map cmd+w       close_window_with_confirmation ignore-shell
map kitty_mod+w close_tab

# window management
map shift+up    move_window up
map shift+left  move_window left
map shift+right move_window right
map shift+down  move_window down

# scrollback
map cmd+g          show_last_command_output
map kitty_mod+g    show_scrollback
map cmd+up         scroll_page_up
map cmd+down       scroll_page_down
map kitty_mod+up   scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1

# Let herdr handle shared shortcuts in its own window. An empty action passes
# the key through. cmdline matches the window's root process only, so it finds
# herdr when kitty starts it directly. When herdr runs from a shell, the
# herdr-remote fish function sets the in_herdr user variable instead.
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+n
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+p
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+r
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+s
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+up
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+down
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+left
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+right
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+t
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+shift+w
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+[
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+]
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+enter
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+shift+enter
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+w
map --when-focus-on "cmdline:herdr or var:in_herdr=1" cmd+z
