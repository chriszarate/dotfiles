kitty_mod cmd+shift

# actions
map cmd+e       open_url_with_hints
map cmd+shift+e kitten hints --type=linenum --linenum-action=window fish -c "nvim +{line} {path}"

# layouts
map cmd+enter       launch --cwd=current
map cmd+l           next_layout
map cmd+z           toggle_layout stack
map kitty_mod+enter launch

# navigation
map cmd+[       previous_window
map cmd+]       next_window
map cmd+left    previous_tab
map cmd+right   next_tab
map cmd+p       kitten kittens/select_tab.py
map cmd+s       kitten kittens/toggle_tab_bar.py
map cmd+w       close_window_with_confirmation ignore-shell
map kitty_mod+w close_tab

# window management
map shift+up    move_window up
map shift+left  move_window left
map shift+right move_window right
map shift+down  move_window down

# scrollback
map cmd+g          show_last_command_output
map kitty_mod+g    show_scrollback
map cmd+up         scroll_page_up
map cmd+down       scroll_page_down
map kitty_mod+up   scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1

# Let herdr handle shared shortcuts in its own window. This matches
# ui.window_title in herdr/config.toml; an empty action passes the key through.
map --when-focus-on "title:^herdr " cmd+n
map --when-focus-on "title:^herdr " cmd+p
map --when-focus-on "title:^herdr " cmd+r
map --when-focus-on "title:^herdr " cmd+s
map --when-focus-on "title:^herdr " cmd+up
map --when-focus-on "title:^herdr " cmd+down
map --when-focus-on "title:^herdr " cmd+left
map --when-focus-on "title:^herdr " cmd+right
map --when-focus-on "title:^herdr " cmd+t
map --when-focus-on "title:^herdr " cmd+shift+w
map --when-focus-on "title:^herdr " cmd+[
map --when-focus-on "title:^herdr " cmd+]
map --when-focus-on "title:^herdr " cmd+enter
map --when-focus-on "title:^herdr " cmd+shift+enter
map --when-focus-on "title:^herdr " cmd+w
map --when-focus-on "title:^herdr " cmd+z
