onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
# Active tab background, among other highlights. Gruvbox blue.
accent = "#458588"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
status_indicators = "dots"
window_title = "herdr {hostname}:{workspace}"

# Subscription usage for the agent in the active workspace: Codex when the
# workspace runs Codex, Claude otherwise. See bin/helpers/agent-quota. The
# short interval only re-picks which agent to show; the quota scripts cache
# their API responses for a minute.
tab_bar_right = [
	{ type = "command", command = "$HOME/.bin/agent-quota", interval_seconds = 5, timeout_seconds = 5 },
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/Code/worktrees"
