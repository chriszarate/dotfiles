onboarding = false

[keys]
prefix = "ctrl+b"

# Workspaces
previous_workspace = "cmd+up"
next_workspace = "cmd+down"
new_workspace = "cmd+n"
workspace_picker = "cmd+p"
toggle_sidebar = "cmd+s"

# Tabs
previous_tab = "cmd+left"
next_tab = "cmd+right"
new_tab = "cmd+t"
close_tab = "cmd+shift+w"

# Panes
# Cycle through every pane, as kitty's previous_window/next_window do.
cycle_pane_previous = "cmd+["
cycle_pane_next = "cmd+]"
focus_pane_left = "alt+["
focus_pane_right = "alt+]"
focus_pane_down = "alt+shift+]"
focus_pane_up = "alt+shift+["
split_vertical = "cmd+enter"
split_horizontal = "cmd+shift+enter"
close_pane = "cmd+w"
zoom = "cmd+z"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
# Active tab background, among other highlights. Gruvbox blue.
accent = "#458588"

[ui]
pane_borders = "off"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
status_indicators = "dots"
window_title = "herdr {hostname}:{workspace}"

# Agents panel. The agent-usage plugin (github.com/chriszarate/herdr-agent-usage,
# linked by bin/setup-herdr.sh) renames each agent to "agent:model" and sets
# $quota, or $quota_high when usage is above 85%.
[ui.sidebar.agents]
rows = [
	["state_icon", "machine", "workspace", "tab"],
	["agent", "$quota", { token = "$quota_high", fg = "#fb4934" }],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "off"

[worktrees]
directory = "~/Code/worktrees"
