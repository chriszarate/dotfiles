worktree-path = "~/Code/worktrees/{{ repo }}/{{ branch | sanitize }}"

[aliases]
new = "wt switch --no-cd --create {{ args }}"

[commit.generation]
command = "claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

[list]
json-schema = 2

[post-remove]
herdr = "herdr-worktree close {{ worktree_path }}"

[post-switch]
herdr = "herdr-worktree open {{ repo_path }} {{ worktree_path }}"

# Gutenberg and plugins built around it (WordPress/gutenberg,
# Automattic/gutenberg-sync-engines). All use wp-env on a per-branch port.
[projects."github.com/*/gutenberg*".aliases]
open = "open http://localhost:{{ branch | hash_port }}/wp-admin/"
start = "WP_ENV_PORT={{ branch | hash_port }} npm run env start -- --update=false"

# pre-remove (not post-remove) so the command runs inside the worktree
# being removed and targets its wp-env instance.
[projects."github.com/*/gutenberg*".pre-remove]
env = "npm run env destroy &> /dev/null || true"

# [[Pipeline]] steps run in sequence
[[projects."github.com/*/gutenberg*".post-start]]
copy = "wt step copy-ignored"
[[projects."github.com/*/gutenberg*".post-start]]
install1 = "composer install; composer dump-autoload"
install2 = "npm install"

# remote-data-blocks: wp-env via ./bin/start, which respects WP_ENV_PORT.
# copy-ignored brings node_modules and vendor from the source worktree;
# npm install fixes up anything stale (postinstall runs composer install).
[projects."github.com/Automattic/remote-data-blocks".aliases]
open = "open http://localhost:{{ branch | hash_port }}/wp-admin/"
start = "WP_ENV_PORT={{ branch | hash_port }} npm run dev"

[projects."github.com/Automattic/remote-data-blocks".pre-remove]
env = "npm run dev:destroy &> /dev/null || true"

[[projects."github.com/Automattic/remote-data-blocks".post-start]]
copy = "wt step copy-ignored"
[[projects."github.com/Automattic/remote-data-blocks".post-start]]
install = "npm install"

# wordpress-develop: docker-compose env. copy-ignored brings .env and
# node_modules; LOCAL_PORT set on the command line beats the copied .env,
# and the compose project name comes from the directory, so each worktree
# gets its own containers and port.
[projects."github.com/WordPress/wordpress-develop".aliases]
open = "open http://localhost:{{ branch | hash_port }}/wp-admin/"
start = "LOCAL_PORT={{ branch | hash_port }} npm run env:start && LOCAL_PORT={{ branch | hash_port }} npm run env:install"

[projects."github.com/WordPress/wordpress-develop".pre-remove]
env = "npm run env:clean &> /dev/null || true"

[[projects."github.com/WordPress/wordpress-develop".post-start]]
copy = "wt step copy-ignored"
[[projects."github.com/WordPress/wordpress-develop".post-start]]
install = "npm install"
[[projects."github.com/WordPress/wordpress-develop".post-start]]
build = "npm run build:dev"

# blog: copy-ignored brings the gitignored .env (Tina credentials) and
# node_modules; dev server ports are fixed, so run one worktree at a time.
[[projects."github.com/chriszarate/blog".post-start]]
copy = "wt step copy-ignored"
[[projects."github.com/chriszarate/blog".post-start]]
install = "npm install"

# Notes has no remote, so match its path under any home directory.
[projects."*/Documents/Notes".aliases]
digest = "claude -p --model=opus --permission-mode=auto '/context-a8c:digest'"
