worktree-path = "~/Code/worktrees/{{ repo }}/{{ branch | sanitize }}"

[aliases]
new = "wt switch --create {{ args }}"
js-install = "wt step copy-ignored && npm install"
wp-open = "open http://localhost:{{ branch | hash_port }}/wp-admin/"
wp-start = "WP_ENV_PORT={{ branch | hash_port }} npm run wp-env start -- --update=false"
wp-start-tests = "WP_ENV_PORT=$(( {{ branch | hash_port }} + 1 )) npm run wp-env-test start -- --update=false"

[[aliases.wp-destroy]]
wp-destroy = "npm run wp-env -- destroy --force &> /dev/null || true"
[[aliases.wp-destroy]]
wp-destroy-tests = "npm run wp-env-test -- destroy --force &> /dev/null || true"

# Copy first, then run Composer and npm concurrently.
[[aliases.wp-install]]
copy = "wt step copy-ignored"
[[aliases.wp-install]]
composer = "composer install; composer dump-autoload"
npm = "npm install"

[list]
json-schema = 2

[post-remove]
herdr = "herdr-worktree close {{ worktree_path }}"

[post-switch]
herdr = "herdr-worktree open {{ repo_path }} {{ worktree_path }}"

[pre-start]
sync = "git fetch {{ remote }} {{ default_branch }} && git merge --ff-only {{ remote }}/{{ default_branch }} || true"

[switch]
cd = false

##
## Project config
##

[projects."github.com/*/gutenberg*".aliases]
open = "wt wp-open"
start = "wt wp-start"
install = "wt wp-install"

# pre-remove (not post-remove) so it runs inside the worktree being removed
[projects."github.com/*/gutenberg*".pre-remove]
env = "wt wp-destroy"

[projects."github.com/Automattic/remote-data-blocks".aliases]
open = "wt wp-open"
start = "WP_ENV_PORT={{ branch | hash_port }} npm run dev"
install = "wt js-install"

[projects."github.com/Automattic/remote-data-blocks".pre-remove]
env = "npm run dev:destroy &> /dev/null || true"

[projects."github.com/WordPress/wordpress-develop".aliases]
open = "wt wp-open"
start = "LOCAL_PORT={{ branch | hash_port }} npm run env:start && LOCAL_PORT={{ branch | hash_port }} npm run env:install"
install = "wt js-install && npm run build:dev"

[projects."github.com/WordPress/wordpress-develop".pre-remove]
env = "npm run env:clean &> /dev/null || true"

[projects."github.com/chriszarate/blog".aliases]
install = "wt js-install"
